name: Test Python

on:
  push:
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false  # Continue testing other combinations even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install 7-Zip (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
            sudo apt-get update
            sudo apt-get install -y p7zip-full
            echo "SEVENZIP_BINARY=$(which 7zz || which 7z)" >> $GITHUB_ENV

      - name: Install 7-Zip (Windows)
        if: matrix.os == 'windows-latest'
        run: |
            choco install 7zip -y
            $7zPath = (Get-Command 7z.exe).Source
            echo "SEVENZIP_BINARY=$7zPath" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install 7-Zip (macOS)
        if: matrix.os == 'macos-latest'
        run: |
            brew install p7zip
            echo "SEVENZIP_BINARY=$(which 7zz || which 7z)" >> $GITHUB_ENV

      - name: Verify 7-Zip installation
        run: |
            echo "7-Zip binary location: ${{ env.SEVENZIP_BINARY }}"
        shell: bash

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install pytest pytest-cov
            pip install -e ".[dev]"

      - name: Run tests
        run: |
            pytest tests/ -v --tb=short \
            --cov=src/p7zip \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest'
        with:
            files: coverage.xml
            flags: unittests
            verbose: true
            fail_ci_if_error: false
    
      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
            name: coverage-report
            path: htmlcov/
            retention-days: 30