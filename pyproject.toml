[project]
name = "p7zip"
version = "1.0.1"
description = "Python wrapper for 7zz/7za command-line utility"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "MZDevX", email = "mzdevx@gmail.com" }
]
keywords = ["7zip", "7za", "7zz", "compression", "archive", "7z", "extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "send2trash>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]

[project.urls]
Homepage = "https://github.com/mzdevx/p7zip"
Documentation = "https://github.com/mzdevx/p7zip#readme"
Repository = "https://github.com/mzdevx/p7zip"
Issues = "https://github.com/mzdevx/p7zip/issues"
Changelog = "https://github.com/mzdevx/p7zip/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/p7zip"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_level = "DEBUG"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/p7zip",
    "--cov-report=html",
    "--cov-report=term",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for complete workflows",
    "slow: Tests that take significant time to execute",
    "requires_binary: Tests that require 7z binary to be installed",
]

[tool.coverage.run]
source = ["src/p7zip"]
omit = [
    "*/api.py",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 88
target-version = ['py37']
include = '\.pyi?$'
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
  ^/foo.py       # exclude a file named foo.py in the root of the project
  | .*_pb2.py    # exclude autogenerated Protocol Buffer files anywhere in the project
)
'''

[tool.isort]
profile = "black"
line_length = 88
